name: Run Capitol copytrader

on:
  workflow_dispatch:
  # Optional fallback. External cronjob.org dispatch is the primary trigger.
  # schedule:
  #   - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: capitol-copytrader-state
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run bot
        env:
          CAPITOL_TRADES_URL: ${{ vars.CAPITOL_TRADES_URL || 'https://www.capitoltrades.com/trades' }}
          ENABLE_TRADING: ${{ vars.ENABLE_TRADING || 'false' }}
          DRY_RUN: ${{ vars.DRY_RUN || 'true' }}
          TRADING_MODE: ${{ vars.TRADING_MODE || 'paper' }}
          CONFIRM_LIVE_TRADING: ${{ secrets.CONFIRM_LIVE_TRADING }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_PAPER: ${{ vars.ALPACA_PAPER || 'true' }}
          DEFAULT_NOTIONAL_USD: ${{ vars.DEFAULT_NOTIONAL_USD || '10' }}
          MAX_TRADES_PER_RUN: ${{ vars.MAX_TRADES_PER_RUN || '3' }}
          MAX_SYMBOL_EXPOSURE_USD: ${{ vars.MAX_SYMBOL_EXPOSURE_USD || '50' }}
          ALLOWED_TICKERS: ${{ vars.ALLOWED_TICKERS }}
          BLOCKED_TICKERS: ${{ vars.BLOCKED_TICKERS }}
          ALLOW_AFTER_HOURS_QUEUE: ${{ vars.ALLOW_AFTER_HOURS_QUEUE }}
          ALLOW_LIVE_MARKET_ORDERS: ${{ vars.ALLOW_LIVE_MARKET_ORDERS }}
        run: python -m src.main

      - name: Commit state
        run: |
          if git diff --quiet -- data/processed_trades.json data/last_run.json; then
            echo "No state changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed_trades.json data/last_run.json
          git commit -m "chore: update trade bot state"
          git push
