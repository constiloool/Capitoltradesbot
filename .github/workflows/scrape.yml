name: Ingest Official Congressional Disclosures

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 15-21 * * 1-5"

permissions:
  contents: read
  actions: write

concurrency:
  group: congressional-disclosures-ingest
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SOURCE_MODE: official_disclosures
      SAFE_MODE: ${{ secrets.SAFE_MODE || 'false' }}
      STORE_RAW_PDFS: "false"
      PDF_RETENTION_DAYS: "7"
      RAW_PDF_DIR: ./data/raw-pdfs
      DOWNLOAD_TIMEOUT_MS: "30000"
      MAX_FILINGS_PER_RUN: "50"
      DATABASE_PATH: ./data/capitoltrades.sqlite
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      ALPACA_BASE_URL: ${{ secrets.ALPACA_BASE_URL || 'https://paper-api.alpaca.markets' }}
      PAPER_ORDER_QTY: ${{ secrets.PAPER_ORDER_QTY || '1' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Restore SQLite state
        id: sqlite-restore
        uses: actions/cache/restore@v4
        with:
          path: data/capitoltrades.sqlite
          key: capitoltrades-sqlite-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            capitoltrades-sqlite-

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Initialize database
        run: npm run db:init

      - name: Verify Alpaca paper connection
        run: npm run alpaca:check

      - name: Ingest official disclosures
        run: npm run ingest

      - name: Save SQLite state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/capitoltrades.sqlite
          key: capitoltrades-sqlite-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload database artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capitoltrades-db-${{ github.run_number }}
          path: data/capitoltrades.sqlite
          if-no-files-found: warn
          retention-days: 30
