name: Ingest Official Congressional Disclosures

on:
  workflow_dispatch:
  schedule:
    # Morning disclosure fetch around the German cash-market open (UTC).
    - cron: "7 7 * * 1-5"
    # Frequent checks before, during and shortly after the regular US session.
    - cron: "7-59/15 13-21 * * 1-5"

permissions:
  contents: write
  actions: write

concurrency:
  group: congressional-disclosures-ingest
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SOURCE_MODE: official_disclosures
      SAFE_MODE: ${{ secrets.SAFE_MODE || 'true' }}
      ALLOW_LIVE_TRADING: "false"
      MAX_TRADE_AGE_DAYS: "7"
      BASE_POSITION_PCT: "0.01"
      MAX_POSITION_PER_TICKER_PCT: "0.03"
      MAX_TOTAL_EXPOSURE_PCT: "0.30"
      MIN_SHARE_PRICE: "5"
      BROKER_MIN_ORDER_VALUE: "1"
      TAKE_PROFIT_PCT: "0.30"
      STOP_LOSS_PCT: "0.12"
      MAX_HOLDING_DAYS: "45"
      MAX_RUNUP_PCT: "0.10"
      SKIP_IF_PRICE_HISTORY_MISSING: "true"
      POLITICIAN_SCORES_PATH: ./data/politician_scores.json
      STORE_RAW_PDFS: "false"
      PDF_RETENTION_DAYS: "7"
      RAW_PDF_DIR: ./data/raw-pdfs
      DOWNLOAD_TIMEOUT_MS: "30000"
      MAX_FILINGS_PER_RUN: "50"
      DATABASE_PATH: ./data/capitoltrades.sqlite
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      ALPACA_BASE_URL: ${{ secrets.ALPACA_BASE_URL || 'https://paper-api.alpaca.markets' }}
      PAPER_ORDER_QTY: ${{ secrets.PAPER_ORDER_QTY || '1' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Restore SQLite state
        id: sqlite-restore
        uses: actions/cache/restore@v4
        with:
          path: data/capitoltrades.sqlite
          key: capitoltrades-sqlite-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            capitoltrades-sqlite-

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Initialize database
        run: npm run db:init

      - name: Ingest official disclosures
        run: npm run ingest

      - name: Export read-only dashboard data
        run: npm run dashboard:export

      - name: Save SQLite state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/capitoltrades.sqlite
          key: capitoltrades-sqlite-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload database artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capitoltrades-db-${{ github.run_number }}
          path: data/capitoltrades.sqlite
          if-no-files-found: warn
          retention-days: 30

      - name: Publish dashboard data branch
        if: success()
        run: |
          export_dir="$(mktemp -d)"
          cp dashboard-data/*.json "$export_dir/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan dashboard-data-publish
          git rm -rf .
          mkdir -p dashboard-data
          cp "$export_dir"/*.json dashboard-data/
          git add dashboard-data
          git commit -m "Update dashboard data"
          git push --force origin HEAD:dashboard-data
